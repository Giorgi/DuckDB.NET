version: 2
updates:
  # Keeps the actions pinned to commit SHAs in the workflows up to date, along with the version comments.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # NuGet.yml uses it to find the CI run whose packages are published, and v23 rewrote how it finds runs.
      # Stay on v21 until that is tested or the action is replaced.
      - dependency-name: "dawidd6/action-download-artifact"
